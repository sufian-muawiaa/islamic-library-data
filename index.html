<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>من الدليل إلى العمل</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f5f3ec; --card:#ffffff; --ink:#1c2620; --muted:#6b7770;
  --brand:#0f5132; --brand-2:#157347; --gold:#b8860b; --line:#e3e0d5;
  --accent:#f0ede3; --danger:#b02a37; --radius:16px;
}
[data-theme="dark"]{
  --bg:#12140f; --card:#1b1f18; --ink:#e8e6dd; --muted:#9aa39a;
  --brand:#3fa06a; --brand-2:#4fb87c; --gold:#d4a52a; --line:#2a2f26; --accent:#20261d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI','Tahoma',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:var(--fs,16px); line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:78px;position:relative}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.topbar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1}
.topbar .ic{background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer}
.screen{padding:16px;display:none;animation:fade .25s}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{margin:0 0 8px;font-size:1.05rem;color:var(--brand)}
.muted{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;text-align:center}
.tile:active{transform:scale(.97)}
.tile .em{font-size:1.7rem;display:block;margin-bottom:6px}
.tile .lb{font-weight:600;font-size:.95rem}
.btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{opacity:.85}
.btn.ghost{background:var(--accent);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.chip{display:inline-block;background:var(--accent);border:1px solid var(--line);border-radius:20px;padding:6px 14px;margin:4px 4px 4px 0;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
input,textarea,select{width:100%;font-family:inherit;font-size:1rem;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:6px 0}
.src{font-size:.82rem;color:var(--gold);background:var(--accent);border-radius:8px;padding:6px 10px;margin-top:8px;display:block;border-right:3px solid var(--gold)}
.tag{display:inline-block;font-size:.72rem;background:var(--accent);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-left:4px;color:var(--muted)}
.arabic-text{font-size:1.2rem;line-height:2.2;font-family:'Amiri','Traditional Arabic',serif}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:60}
.nav button{flex:1;background:none;border:none;padding:9px 2px;color:var(--muted);font-size:.68rem;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ni{font-size:1.25rem}
.nav button.on{color:var(--brand);font-weight:700}
.result{border-right:4px solid var(--brand);padding-right:12px;margin-bottom:14px}
.why{font-size:.78rem;color:var(--muted);cursor:pointer;text-decoration:underline;margin-top:6px;display:inline-block}
.pkg{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.on{background:var(--brand-2)} .dot.off{background:var(--muted)} .dot.upd{background:var(--gold)}
.sec-title{font-weight:700;color:var(--brand);margin:18px 0 8px;font-size:1rem;border-bottom:2px solid var(--line);padding-bottom:4px}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.pill.q{background:#e7f0ea;color:#0f5132} .pill.h{background:#f3ecdc;color:#8a6d1a} .pill.f{background:#e8eaf3;color:#3a4a8a} .pill.t{background:#f3e8ec;color:#8a3a5a}
.splash{position:fixed;inset:0;background:var(--brand);color:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.splash .bism{font-size:1.5rem;font-family:'Amiri',serif;margin-bottom:20px;opacity:.9}
.splash .nm{font-size:2rem;font-weight:800;margin-bottom:8px}
.splash .sl{opacity:.85;margin-bottom:40px}
progress{width:100%;height:8px}
.note-item{background:var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.92rem}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .em{font-size:3rem;display:block;margin-bottom:10px;opacity:.5}
</style>
</head>
<body>
<!-- ===== SPLASH ===== -->
<div class="splash" id="splash">
  <div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <div class="nm">من الدليل إلى العمل</div>
  <div class="sl">منصة معرفة إسلامية تعمل دون إنترنت</div>
  <button class="btn ghost" onclick="startApp()">ابدأ رحلتك</button>
</div>

<!-- ===== ONBOARDING ===== -->
<div class="splash hidden" id="onboard" style="align-items:stretch;justify-content:flex-start">
  <div id="obContent" style="flex:1;display:flex;flex-direction:column;justify-content:center"></div>
  <div style="display:flex;gap:10px">
    <button class="btn ghost" style="flex:1" onclick="skipOnboard()">تخطي</button>
    <button class="btn ghost" style="flex:2" id="obNext" onclick="nextOnboard()">التالي</button>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div class="app hidden" id="app">
  <div class="topbar">
    <button class="ic" onclick="openMore()">≡</button>
    <h1 id="barTitle">الرئيسية</h1>
    <button class="ic" onclick="go('search')">🔍</button>
  </div>

  <div id="scr-home" class="screen active"></div>
  <div id="scr-discover" class="screen"></div>
  <div id="scr-knowledge" class="screen"></div>
  <div id="scr-learn" class="screen"></div>
  <div id="scr-mine" class="screen"></div>
  <div id="scr-search" class="screen"></div>
  <div id="scr-need" class="screen"></div>
  <div id="scr-journey" class="screen"></div>
  <div id="scr-review" class="screen"></div>
  <div id="scr-library" class="screen"></div>
  <div id="scr-reader" class="screen"></div>
  <div id="scr-packages" class="screen"></div>
  <div id="scr-settings" class="screen"></div>
  <div id="scr-sources" class="screen"></div>
  <div id="scr-more" class="screen"></div>
  <div id="scr-assist" class="screen"></div>
  <div id="scr-quran" class="screen"></div>
  <div id="scr-hadith" class="screen"></div>
  <div id="scr-fatwa" class="screen"></div>
  <div id="scr-riyad" class="screen"></div>
  <div id="scr-tafsir" class="screen"></div>
  <div id="scr-ktb" class="screen"></div>
  <div id="scr-ktbread" class="screen"></div>

  <div class="nav">
    <button data-t="home" class="on" onclick="go('home')"><span class="ni">🏠</span>الرئيسية</button>
    <button data-t="discover" onclick="go('discover')"><span class="ni">✨</span>اكتشف</button>
    <button data-t="knowledge" onclick="go('knowledge')"><span class="ni">📚</span>المعرفة</button>
    <button data-t="learn" onclick="go('learn')"><span class="ni">🎓</span>تعلّم</button>
    <button data-t="mine" onclick="go('mine')"><span class="ni">🧭</span>رحلتي</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="packages/quran.js"></script>
<script src="packages/hadith.js"></script>
<script src="packages/riyad.js"></script>
<script src="packages/tafsir/_meta.js"></script>
<script src="packages/remote_manifest.js"></script>
<script src="packages/library_manifest.js"></script>
<script>
/* =========================================================
   إعدادات الحِزم القابلة للتنزيل (نواة خفيفة + حِزم اختيارية)
   ⚙️ غيّر USERNAME و REPO إلى اسم حسابك ومستودعك على GitHub.
   الرابط الناتج يمر عبر jsDelivr (مجاني + سريع + يدعم CORS).
   التطبيق يعمل دون إنترنت تماماً؛ الإنترنت يُستخدم فقط لحظة تنزيل حزمة.
   ========================================================= */
const CONFIG={
  baseUrl:'https://cdn.jsdelivr.net/gh/USERNAME/REPO@main/remote_pkgs/'
};
</script>
<script>
/* =========================================================
   من الدليل إلى العمل — نواة التطبيق (Offline-first)
   ملاحظة: المحتوى أدناه عيّنة تجريبية محدودة لإثبات النواة
   يجب استبدالها بحزم معرفية موثقة ومرخّصة الحقوق.
   ========================================================= */

/* ---- قاعدة المصادر (عيّنة) ---- */
const DB = {
  content: [
    {id:'q1',type:'quran',text:'الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۛ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ',src:'القرآن الكريم',ref:'سورة الرعد: 28',topics:['القلق','الطمأنينة','الذكر','الإيمان']},
    {id:'q2',type:'quran',text:'يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۛ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ',src:'القرآن الكريم',ref:'سورة البقرة: 153',topics:['الصبر','الصلاة','الحزن','الابتلاء']},
    {id:'q3',type:'quran',text:'وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ە وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ',src:'القرآن الكريم',ref:'سورة الطلاق: 2-3',topics:['التقوى','الرزق','القلق','المال','الفرج']},
    {id:'h1',type:'hadith',text:'لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِندَ الغَضَبِ',src:'صحيح البخاري',ref:'كتاب الأدب، رقم 6114',topics:['الغضب','ضبط النفس','الأخلاق']},
    {id:'h2',type:'hadith',text:'إِذَا غَضِبَ أَحَدُكُمْ وَهُوَ قَائِمٌ فَلْيَجْلِسْ، فَإِن ذَهَبَ عَنْهُ الْغَضَبُ وَإِلَّا فَلْيَضْطَجِعْ',src:'سنن أبي داود',ref:'رقم 4782 (صحّحه الألباني)',topics:['الغضب','العلاج','الأخلاق']},
    {id:'h3',type:'hadith',text:'مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ',src:'صحيح مسلم',ref:'رقم 47',topics:['الكلام','الأخلاق','اللسان']},
    {id:'h4',type:'hadith',text:'مَنْ لَا يَرْحَمِ النَّاسَ لَا يَرْحَمُهُ اللَّهُ',src:'صحيح البخاري',ref:'رقم 7376',topics:['الرحمة','الأخلاق','الأسرة','العلاقات']},
    {id:'f1',type:'fiqh',text:'التوبة النصوح تجمع أركانًا: الإقلاع عن الذنب، والندم على فعله، والعزم على ألا يعود، وإن كان لآدمي حق ردّه إليه.',src:'رياض الصالحين — باب التوبة',ref:'للإمام النووي (مادة منقولة)',topics:['التوبة','الندم','الذنوب']}
  ],
  /* توسيع المفاهيم: مرادفات لربط مدخلات المستخدم بالمواضيع */
  concepts:{
    'غضب':['الغضب','ضبط النفس'],'الغضب':['الغضب'],
    'حزين':['الحزن','الصبر','الطمأنينة'],'حزن':['الحزن','الصبر'],
    'قلق':['القلق','الطمأنينة','الذكر'],'القلق':['القلق','الطمأنينة'],
    'مال':['المال','الرزق','التقوى'],'المال':['المال','الرزق'],'رزق':['الرزق'],
    'توبة':['التوبة','الندم','الذنوب'],'نادم':['الندم','التوبة'],
    'صبر':['الصبر','الابتلاء'],'الصبر':['الصبر'],
    'الأسرة':['الأسرة','الرحمة','العلاقات'],'أسرة':['الأسرة','الرحمة'],
    'الكلام':['الكلام','اللسان'],'كلام':['الكلام','اللسان'],
    'ذكر':['الذكر'],'الإيمان':['الإيمان','الذكر'],'الصلاة':['الصلاة']
  },
  journeys:[
    {id:'j-sabr',title:'رحلة الصبر',em:'🌱',intro:'الصبر ضياء؛ رحلة تربط الأدلة بالفهم ثم التطبيق.',stages:[
      {t:'ما الصبر؟',body:'الصبر حبس النفس على طاعة الله وعن معصيته وعند أقداره.',cid:'q2'},
      {t:'الدليل',body:'مع الصابرين معية خاصة من الله.',cid:'q2'},
      {t:'التطبيق',body:'اختر موقفًا تدرّبت فيه على الصبر اليوم.',cid:null}
    ]},
    {id:'j-dhikr',title:'رحلة الذكر والطمأنينة',em:'🩵',intro:'طمأنينة القلب بذكر الله.',stages:[
      {t:'الدليل',body:'بذكر الله تطمئن القلوب.',cid:'q1'},
      {t:'الفهم',body:'الذكر دواء للقلق والوحشة.',cid:'q1'},
      {t:'التطبيق',body:'اجعل لك وردًا يوميًا من الأذكار.',cid:null}
    ]}
  ],
  packages:[
    {id:'quran',name:'القرآن الكريم (كامل)',status:'on',size:'114 سورة / 6236 آية',ver:'1.0'},
    {id:'core',name:'الحزمة الأساسية (عيّنة)',status:'on',size:'عيّنة',ver:'0.1'},
    {id:'hadith',name:'حزمة الحديث (صحيح البخاري وصحيح مسلم)',status:'on',size:'12398 حديثاً',ver:'1.0'},
    {id:'riyad',name:'رياض الصالحين (كامل)',status:'on',size:'1896 حديثاً / 20 كتاباً',ver:'1.0'},
    {id:'tafsir',name:'تفسير ابن كثير (مدمج)',status:'on',size:'6236 آية • يعمل دون إنترنت',ver:'2.0'},
    {id:'fatwa',name:'حزمة الفتاوى (ابن باز، ابن عثيمين)',status:'off',size:'بانتظار الإذن',ver:'-'},
    {id:'arabic',name:'حزمة العربية (نحو، صرف، بلاغة)',status:'off',size:'وفق الحقوق',ver:'-'}
  ]
};

/* ---- تخزين محلي (خاص بالمستخدم) ---- */
const KEY='mdim_state_v1';
let S = load();
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||def()}catch(e){return def()} }
function def(){return{onboarded:false,interests:[],level:'',theme:'',fs:16,
  notes:[],bookmarks:[],reviews:[],progress:{},actions:[],goals:[],journeys:{},lastRead:null,
  history:[],aiEnabled:false,aiSources:['quran','hadith']};}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){let d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:20px;z-index:300;font-size:.9rem;box-shadow:0 4px 12px rgba(0,0,0,.2)';document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}

/* ---- الإقلاع والتعريف ---- */
function applyTheme(){
  let t=S.theme||'';
  if(t==='')t=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
  document.documentElement.style.setProperty('--fs',(S.fs||16)+'px');
}
function startApp(){
  document.getElementById('splash').classList.add('hidden');
  if(S.onboarded){ enterApp(); } else { document.getElementById('onboard').classList.remove('hidden'); obStep=0; renderOnboard(); }
}
let obStep=0;
const OB=[
  {big:'📖',t:'اقرأ',d:'نصوص أصلية موثقة مرتبطة دائمًا بمصادرها.'},
  {big:'💡',t:'افهم',d:'معانٍ وعلاقات بين الآية والحديث والتفسير واللغة.'},
  {big:'✅',t:'اعمل',d:'من العلم إلى العمل: تطبيق ومتابعة شخصية غير تنافسية.'},
  {big:'🏷️',t:'اختر اهتماماتك (اختياري)',interests:true},
  {big:'📊',t:'مستوى العمق',levels:true}
];
const INTERESTS=['تعلم الدين','زيادة الإيمان','العبادات','الأخلاق','القرآن والحديث','طلب العلم','المواد الدعوية','الاستفادة اليومية'];
const LEVELS=['البداية','التعلم','التوسع'];
function renderOnboard(){
  const o=OB[obStep];let h=`<div style="text-align:center"><div style="font-size:3.5rem;margin-bottom:14px">${o.big}</div><h2 style="margin:0 0 10px">${o.t}</h2>`;
  if(o.d)h+=`<p style="opacity:.85">${o.d}</p>`;
  if(o.interests){h+='<div style="display:flex;flex-wrap:wrap;justify-content:center;margin-top:16px">'+INTERESTS.map(i=>`<span class="chip ${S.interests.includes(i)?'on':''}" onclick="tglInterest('${i}')">${i}</span>`).join('')+'</div>';}
  if(o.levels){h+='<div style="display:flex;flex-wrap:wrap;justify-content:center;margin-top:16px">'+LEVELS.map(l=>`<span class="chip ${S.level===l?'on':''}" onclick="setLevel('${l}')">${l}</span>`).join('')+'</div><p class="muted" style="margin-top:14px">ليست مراتب دينية، بل تنظيم للعرض.</p>';}
  h+='</div>';document.getElementById('obContent').innerHTML=h;
  document.getElementById('obNext').textContent=obStep===OB.length-1?'ابدأ':'التالي';
}
function tglInterest(i){const x=S.interests.indexOf(i);x<0?S.interests.push(i):S.interests.splice(x,1);save();renderOnboard();}
function setLevel(l){S.level=l;save();renderOnboard();}
function nextOnboard(){ if(obStep<OB.length-1){obStep++;renderOnboard();}else{finishOnboard();} }
function skipOnboard(){finishOnboard();}
function finishOnboard(){S.onboarded=true;save();document.getElementById('onboard').classList.add('hidden');enterApp();}
function enterApp(){document.getElementById('app').classList.remove('hidden');go('home');}

/* ---- التوجيه (Router) ---- */

/* ---- البحث المحلي واستخراج المفاهيم ---- */
function normalize(s){return (s||'')
  .replace(/\u0640/g,'')
  .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g,'')
  .replace(/[\u0622\u0623\u0625\u0671\u0672\u0673]/g,'\u0627')
  .replace(/\u0629/g,'\u0647').replace(/\u0649/g,'\u064A')
  .replace(/\u0624/g,'\u0648').replace(/\u0626/g,'\u064A')
  .replace(/[^\u0621-\u064A\s]/g,' ').replace(/\s+/g,' ').trim();}
function extractConcepts(q){
  const nq=normalize(q); const words=nq.split(' ').filter(w=>w.length>1);
  let topics=new Set();
  Object.keys(DB.concepts).forEach(k=>{ if(nq.includes(normalize(k))) DB.concepts[k].forEach(t=>topics.add(t)); });
  return {words,topics:[...topics]};
}
/* ---- فهرس موحّد يدمج العيّنة + الحزم المثبتة (القرآن كاملًا) ---- */
let ALL=[];
function buildAll(){
  ALL=DB.content.map(c=>({...c,_n:normalize(c.text)}));
  if(window.PKG&&window.PKG.quran){
    window.PKG.quran.surahs.forEach(s=>{ s.ayahs.forEach(a=>{
      const ref='سورة '+s.name+': '+a.n;
      ALL.push({id:'q:'+s.n+':'+a.n,type:'quran',text:a.t,src:'القرآن الكريم',ref,topics:[],surah:s.n,sname:s.name,aya:a.n,_n:normalize(a.t)});
    });});
  }
  if(window.PKG&&window.PKG.hadith){
    window.PKG.hadith.books.forEach(b=>{ b.hadiths.forEach(h=>{
      ALL.push({id:'h:'+b.key+':'+h.n,type:'hadith',text:h.m,isnad:h.i,src:b.name,ref:hadRefStr(b,h),topics:[],hkey:b.key,hn:h.n});
    });});
  }
  if(window.PKG&&window.PKG.riyad){
    const R=window.PKG.riyad; const cmap={}; R.chapters.forEach(c=>cmap[c.id]=c.t);
    R.items.forEach(it=>{
      ALL.push({id:'r:'+it.n,type:'riyad',text:it.m,src:R.name,ref:R.name+' — '+(cmap[it.c]||'')+' — رقم '+it.n,topics:[],rn:it.n,rc:it.c});
    });
  }
}
function searchLocal(q){
  const {words,topics}=extractConcepts(q);
  const nq=normalize(q);
  const results=[];
  ALL.forEach(c=>{
    let score=0,why=[];
    const nt=c._n||(c._n=normalize(c.text));
    topics.forEach(t=>{ if(c.topics.includes(t)){score+=5;why.push('علاقة موضوع: '+t);} });
    if(nq.length>4&&nt.includes(nq)){score+=6;why.push('تطابق عبارة');}
    words.forEach(w=>{ if(w.length>2&&nt.includes(w)){score+=2;why.push('تطابق كلمة: '+w);} });
    c.topics.forEach(tp=>{ words.forEach(w=>{ if(w.length>2&&normalize(tp).includes(w))score+=1; }); });
    if(score>0)results.push({...c,score,why:[...new Set(why)]});
  });
  const ded={}; results.forEach(r=>{ if(!ded[r.ref]||ded[r.ref].score<r.score)ded[r.ref]=r; });
  return Object.values(ded).sort((a,b)=>b.score-a.score).slice(0,60);
}
function typeMeta(t){return {quran:{lb:'قرآن',cl:'q'},hadith:{lb:'حديث',cl:'h'},riyad:{lb:'رياض الصالحين',cl:'h'},tafsir:{lb:'تفسير',cl:'t'},fiqh:{lb:'فقه',cl:'f'},tradition:{lb:'تراثي',cl:'t'}}[t]||{lb:t,cl:'q'};}
function contentCard(c,showWhy){
  const m=typeMeta(c.type);
  const isnadBlock=(c.type==='hadith'&&c.isnad)?`<div style="margin:4px 0 2px"><span class="why" onclick="tglIsnad(this)">إظهار السند الكامل ▾</span><div class="isnad hidden" style="font-size:.95rem;color:var(--muted);line-height:2;margin-top:6px;border-right:3px solid var(--line);padding-right:10px">${esc(c.isnad)}</div></div>`:'';
  return `<div class="card result"><span class="pill ${m.cl}">${m.lb}</span>
    <div class="arabic-text" style="margin:10px 0">${esc(c.text)}</div>
    ${isnadBlock}
    <span class="src">📖 ${esc(c.src)} — ${esc(c.ref)}</span>
    ${showWhy&&c.why?`<span class="why" onclick="sheet('<h3>لماذا ظهرت هذه النتيجة؟</h3><p class=&quot;muted&quot;>الترتيب تقني حسب الصلة وليس ترجيحًا دينيًا.</p><ul>${c.why.map(w=>'<li>'+w+'</li>').join('')}</ul>')">لماذا ظهرت؟</span>`:''}
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="chip" onclick="addReview('${c.id}')">➕ للمراجعة</button>
      <button class="chip" onclick="toggleBm('${c.id}')">🔖 حفظ</button>
      <button class="chip" onclick="shareC('${c.id}')">↪️ مشاركة</button>
      <button class="chip" onclick="noteFor('${c.id}')">📝 ملاحظة</button>
    </div></div>`;
}
function findC(id){return ALL.find(c=>c.id===id)||DB.content.find(c=>c.id===id);}

/* ---- إجراءات المحتوى ---- */
function addReview(id){
  if(S.reviews.find(r=>r.cid===id)){toast('موجود في المراجعة');return;}
  const next=Date.now()+864e5; S.reviews.push({cid:id,state:'جديد',next,step:0});save();toast('أُضيف للمراجعة (غدًا)');
}
function toggleBm(id){
  const x=S.bookmarks.indexOf(id); x<0?S.bookmarks.push(id):S.bookmarks.splice(x,1);save();
  toast(x<0?'تم الحفظ':'أُزيل من المحفوظات');
}
function shareC(id){
  const c=findC(id); const txt=c.text+'\n\n📖 '+c.src+' — '+c.ref;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
  else{navigator.clipboard&&navigator.clipboard.writeText(txt);toast('نُسخ النص مع المصدر');}
}
function noteFor(id){
  sheet(`<h3>ملاحظة شخصية</h3><p class="muted">ملاحظتك تُحفظ منفصلة عن النص المصدر.</p>
    <textarea id="nf" rows="4" placeholder="اكتب ملاحظتك..."></textarea>
    <button class="btn full" onclick="saveNote('${id}')">حفظ الملاحظة</button>`);
}
function saveNote(id){

  S.notes.unshift({id:Date.now(),text:v,cid:id||null,at:Date.now()});save();closeSheet();toast('حُفظت الملاحظة');
}

const SITU=['الأسرة','صديق','العمل','المال','الكلام','خلاف/نزاع'];
function renderNeed(){
  document.getElementById('scr-need').innerHTML=`
  <div class="card"><h3>كيف تشعر؟</h3>
    <div>${STATES.map(s=>`<span class="chip" onclick="askQuick('${s}')">${s}</span>`).join('')}</div></div>
  <div class="card"><h3>ما الموقف؟</h3>
    <div>${SITU.map(s=>`<span class="chip" onclick="askQuick('${s}')">${s}</span>`).join('')}</div></div>
  <div class="card"><h3>اسأل موقفك بكلامك</h3>
    <textarea id="needQ" rows="3" placeholder="مثال: كيف أتعامل مع الغضب؟"></textarea>
    <button class="btn full" onclick="askQuick(document.getElementById('needQ').value)">🔍 ابحث في المصادر</button>
    <p class="muted" style="margin-top:8px">هذه الاختيارات تصنع مفاهيم بحث ولا تُصدر حكمًا عليك.</p></div>

function askQuick(q){
  q=(q||'').trim(); if(!q)return;
  S.history.unshift({q,at:Date.now()}); S.history=S.history.slice(0,20); save();
  const res=searchLocal(q);
  const box=document.getElementById('needRes');
  if(!res.length){
    box.innerHTML=`<div class="card empty"><span class="em">🔍</span>لم نجد في المصادر المثبتة على جهازك مادة كافية للإجابة عن هذا السؤال.<br><br><button class="btn ghost" onclick="go('packages')">ابحث عن حزم إضافية</button></div>`;return;
  }
  const grp={quran:[],hadith:[],fiqh:[]};
  res.forEach(r=>{(grp[r.type]||(grp[r.type]=[])).push(r);});
  let h=`<div class="card" style="background:var(--accent)"><span class="muted">المفاهيم المستخرجة:</span> ${[...new Set(res.flatMap(r=>r.topics))].slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}</div>`;
  const secs={quran:'القرآن',hadith:'السنة',fiqh:'المواد العلمية'};
  Object.keys(secs).forEach(k=>{ if(grp[k]&&grp[k].length){h+=`<div class="sec-title">${secs[k]}</div>`+grp[k].map(c=>contentCard(c,true)).join('');} });
  h+='<div class="card muted" style="text-align:center;font-size:.85rem">لا توجد إجابة دينية مولّدة — هذه نصوص منسوبة إلى مصادرها.</div>';
  box.innerHTML=h; box.scrollIntoView({behavior:'smooth'});
}

function openJourney(jid,step){
  const j=DB.journeys.find(x=>x.id===jid); let st=step!==undefined?step:(S.journeys[jid]||0);
  if(st>=j.stages.length)st=j.stages.length-1;

  go('journey');
  document.getElementById('scr-journey').innerHTML=`
  <div class="card"><span class="muted">${j.em} ${j.title} — مرحلة ${st+1}/${j.stages.length}</span>
    <h3>${esc(stg.t)}</h3><p>${esc(stg.body)}</p></div>
  ${c?contentCard(c,false):''}
  <div style="display:flex;gap:8px">
    ${st>0?`<button class="btn ghost" style="flex:1" onclick="openJourney('${jid}',${st-1})">→ السابق</button>`:''}
    ${st<j.stages.length-1?`<button class="btn" style="flex:2" onclick="advJourney('${jid}',${st+1})">التالي ←</button>`:`<button class="btn" style="flex:2" onclick="advJourney('${jid}',${j.stages.length})">إنهاء ✅</button>`}

  const j=DB.journeys.find(x=>x.id===jid);
  S.journeys[jid]=Math.max(S.journeys[jid]||0,to);save();
  if(to>=j.stages.length){toast('أتممت الرحلة بإذن الله');renderJourneys();}else openJourney(jid,to);
}

/* ---- إدارة المعرفة (الحزم) ---- */
function remotePkgCard(rp){
  const inst=pkgInstalled(rp.key),upd=pkgNeedsUpdate(rp.key);
  const dot=inst?(upd?'dot upd':'dot on'):'dot off';
  const state=inst?(upd?'مُنزّلة — يتوفر تحديث':'مُنزّلة • تعمل دون إنترنت'):'غير مُنزّلة';
  let btns='';
  if(!inst)btns=`<button class="chip" onclick="downloadPackage('${rp.key}')">☁️ تنزيل</button>`;
  else{btns=(upd?`<button class="chip" onclick="downloadPackage('${rp.key}')">↻ تحديث</button>`:'')+`<button class="chip" style="border-color:var(--danger);color:var(--danger)" onclick="deletePackage('${rp.key}')">🗑 حذف</button>`;}
  return `<div class="pkg" style="flex-wrap:wrap"><span class="${dot}"></span>
    <div style="flex:1;min-width:180px"><div style="font-weight:600">${esc(rp.name)}</div>
      <div class="muted" style="font-size:.8rem">${esc(rp.author)} • ${state} • ${fmtMB(rp.bytes)} • إصدار ${rp.version}</div></div>
    <div style="display:flex;gap:6px">${btns}</div>
    <div style="flex-basis:100%;margin-top:6px${inst?';display:none':''}"><progress id="dlbar-${rp.key}" value="0" max="1"></progress><div class="muted" id="dllbl-${rp.key}" style="font-size:.72rem"></div></div>
  </div>`;
}

function setTheme(t){S.theme=t;save();applyTheme();renderSettings();}function setFs(v){S.fs=+v;save();applyTheme();}
function toggleAI(){S.aiEnabled=!S.aiEnabled;save();toast(S.aiEnabled?'تم تفعيل المساعد':'تم إيقاف المساعد');renderSettings();}
function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-من-الدليل-الى-العمل.json';a.click();toast('تم تصدير بياناتك');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);S={...def(),...d};save();applyTheme();toast('تمت الاستعادة');go('settings');}catch(x){toast('ملف غير صالح');}};
  r.readAsText(f);
}

function aiEntry(){
  if(!S.aiEnabled){
    sheet(`<h3>🤖 مساعد البحث الذكي</h3>

function enableAI(){S.aiEnabled=true;save();closeSheet();toast('تم تفعيل المساعد');go('assist');}
function tglAiSrc(t){const x=S.aiSources.indexOf(t);x<0?S.aiSources.push(t):S.aiSources.splice(x,1);if(!S.aiSources.length)S.aiSources=['quran'];save();renderAssist();}
function renderAssist(){
  document.getElementById('scr-assist').innerHTML=`

    <h3>🤖 مساعد بحث محصور بالمصادر</h3>

    <div>${AISRC.map(s=>`<span class="chip ${S.aiSources.includes(s[0])?'on':''}" onclick="tglAiSrc('${s[0]}')">${s[1]}</span>`).join('')}</div>
    <p class="muted" style="font-size:.8rem;margin-top:6px">الافتراضي: الكتاب والسنة. المصادر غير المثبتة لا تعطي نتائج حتى تُثبّت حزمتها.</p></div>
  <div class="card"><textarea id="aiQ" rows="3" placeholder="اكتب سؤالك وسأبحث لك في المصادر المحددة..."></textarea>
    <button class="btn full" onclick="aiSearch()">🔍 ابحث في المصادر المحددة</button></div>
  <div id="aiRes"></div>`;
}
function aiSearch(){
  const q=(document.getElementById('aiQ').value||'').trim(); if(!q)return;
  const box=document.getElementById('aiRes');
  let res=searchLocal(q).filter(r=>S.aiSources.includes(r.type));
  const chosen=AISRC.filter(s=>S.aiSources.includes(s[0])).map(s=>s[1]).join('، ');
  if(!res.length){
    box.innerHTML=`<div class="card empty"><span class="em">🔍</span>لم أجد في المصادر المحددة (${chosen}) مادة مطابقة. جرّب توسيع المصادر أو تثبيت حزمة.</div>`;return;
  }
  let h=`<div class="card" style="background:var(--accent)"><span class="muted">بحثت داخل:</span> ${chosen}<br><span class="muted">المفاهيم المستخرجة:</span> ${[...new Set(res.flatMap(r=>r.topics))].slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}</div>`;
  h+=res.map(c=>contentCard(c,true)).join('');
  h+='<div class="card muted" style="text-align:center;font-size:.85rem">هذه نصوص أصلية منسوبة إلى مصادرها — لا توجد إجابة مولّدة ولا حكم شرعي.</div>';
  box.innerHTML=h;box.scrollIntoView({behavior:'smooth'});
}

/* ============ الحديث الشريف (البخاري + مسلم) ============ */
function hadBook(key){return window.PKG.hadith.books.find(b=>b.key===key);}
function ensureHad(b){
  if(b._ready)return;
  b._kids={}; b._bySubj={};
  Object.keys(b.subjects).forEach(k=>{const p=b.subjects[k].p;(b._kids[p]=b._kids[p]||[]).push({id:+k,t:b.subjects[k].t});});
  b.hadiths.forEach(h=>{(b._bySubj[h.s]=b._bySubj[h.s]||[]).push(h);});
  b._cnt={}; b._ready=true;
}
function childrenSubs(b,pid){ensureHad(b);return b._kids[pid]||[];}
function hadCount(b,sid){ensureHad(b);if(b._cnt[sid]!=null)return b._cnt[sid];
  let n=(b._bySubj[sid]||[]).length; childrenSubs(b,sid).forEach(k=>n+=hadCount(b,k.id)); b._cnt[sid]=n; return n;}
function subjPath(b,sid){const subs=b.subjects;let parts=[],cur=sid,g=0;
  while(cur&&subs[cur]&&g<20){parts.unshift(subs[cur].t);cur=subs[cur].p;g++;}
  return parts.join(' \u203a ');}
function hadRefStr(b,h){const p=subjPath(b,h.s);return b.name+(p?(' — '+p):'')+' — رقم '+h.n+(h.g?(' — '+h.g):'');}
function tglIsnad(el){const d=el.parentNode.querySelector('.isnad');const open=!d.classList.contains('hidden');
  d.classList.toggle('hidden');el.textContent=open?'\u0625\u0638\u0647\u0627\u0631 \u0627\u0644\u0633\u0646\u062f \u0627\u0644\u0643\u0627\u0645\u0644 \u25be':'\u0625\u062e\u0641\u0627\u0621 \u0627\u0644\u0633\u0646\u062f \u25b4';}
function hadBooksHtml(){return window.PKG.hadith.books.map(b=>{const sub=b._dl?(b.hadiths.length+' حديث — اضغط للتصفّح'):(b.hadiths.length+' حديث — من الصحيحين — اضغط للتصفّح');return `<div class="card" onclick="openHadithBook('${b.key}')" style="cursor:pointer;border-right:4px solid var(--gold)"><h3>📖 ${esc(b.name)}</h3><span class="muted">${sub}</span></div>`;}).join('');}
function renderHadith(){

  <div class="card"><input id="hFind" placeholder="\ud83d\udd0d \u0627\u0628\u062d\u062b \u0641\u064a \u0645\u062a\u0648\u0646 \u0627\u0644\u0623\u062d\u0627\u062f\u064a\u062b..." oninput="hadSearchAll()"><p class="muted" style="font-size:.78rem;margin:4px 0 0">\u0627\u0644\u0628\u062d\u062b \u0641\u064a \u0627\u0644\u0645\u062a\u0646. \u0627\u0636\u063a\u0637 \u0639\u0644\u0649 \u0643\u062a\u0627\u0628 \u0644\u062a\u0635\u0641\u0651\u062d \u0623\u0628\u0648\u0627\u0628\u0647.</p></div>

function openHadithNode(key,sid){
  const b=hadBook(key); ensureHad(b); go('hadith');

  const crumb=sid?subjPath(b,sid):b.name;

  }
  if(direct.length){
    h+=`<div class="sec-title">\u0627\u0644\u0623\u062d\u0627\u062f\u064a\u062b (${direct.length})</div>`;
    h+=direct.map(x=>contentCard(findC('h:'+key+':'+x.n),false)).join('');

/* ============ محرّك الحِزم القابلة للتنزيل (IndexedDB) ============ */
/* تخزين الحِزم المُنزّلة محليّاً داخل الجهاز؛ لا تُرسل أي بيانات للخارج (تنزيل باتجاه واحد فقط). */
const IDB_NAME='mdim_pkgs',IDB_STORE='blobs';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore(IDB_STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbPut(key,val){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(val,key);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);}));}
function idbGet(key){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);}));}
function idbDel(key){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(key);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);}));}

function remotePkg(key){return ((window.PKG.remoteManifest&&window.PKG.remoteManifest.packages)||[]).find(p=>p.key===key);}
function fmtMB(b){return (b/1048576).toFixed(1)+' م.ب';}
function pkgInstalled(key){return !!(S.installedPkgs&&S.installedPkgs[key]);}
function pkgNeedsUpdate(key){const rec=S.installedPkgs&&S.installedPkgs[key];const rp=remotePkg(key);return !!(rec&&rp&&rp.version>rec.version);}

async function sha256hex(buf){
  try{if(!(crypto&&crypto.subtle))return null;const d=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return null;}
}

/* ---- محوّلات (adapters) لتحويل بيانات المصادر الخارجية إلى بنية التطبيق ---- */
/* محوّل كتب الحديث (مخطط AhmedBaset/hadith-json): كتاب واحد لكل ملف */
function adaptAhmedbasetHadith(rp,objs){
  const j=objs[0]||{};
  const md=(j.metadata&&j.metadata.arabic)||{};
  const subjects={};
  (j.chapters||[]).forEach(c=>{ subjects[c.id]={t:(c.arabic||('كتاب '+c.id)),p:0}; });
  const hadiths=(j.hadiths||[]).map(h=>{
    const o={n:h.idInBook,m:(h.arabic||'').trim(),s:h.chapterId||0};
    if(h.grades&&h.grades.length){const g=h.grades.find(x=>x&&x.grade)||h.grades[0];if(g&&g.grade)o.g=g.grade;}
    return o;
  });
  return {key:rp.key,name:(rp.name||md.title||rp.key),author:(rp.author||md.author||''),subjects,hadiths,_dl:true};
}
/* محوّل الفتاوى (مخطط rn0x/binbaz_database): عدّة ملفات تُدمج في مجموعات */
function adaptBinbazFatwa(rp,objs){
  const collNames=(rp.source&&rp.source.collNames)||[];
  const colls=[],items=[];let uid=0;
  objs.forEach((arr,ci)=>{
    colls.push({id:ci,name:collNames[ci]||('مجموعة '+(ci+1))});
    (arr||[]).forEach(f=>{ items.push({id:++uid,coll:ci,q:(f.question||'').trim(),t:(f.title||'').trim(),a:(f.answer||'').trim(),cats:(f.categories||[]),link:f.link||'',audio:f.audio||''}); });
  });
  return {name:(rp.name||'فتاوى'),author:(rp.author||''),colls,items};
}
/* حقن حزمة مُحوّلة في الذاكرة الحيّة */
function injectPkg(type,built){
  if(type==='hadith'){
    window.PKG.hadith=window.PKG.hadith||{books:[]};
    window.PKG.hadith.books=window.PKG.hadith.books.filter(b=>b.key!==built.key);
    built._dl=true; window.PKG.hadith.books.push(built);
    buildAll();
  }else if(type==='fatwa'){
    window.PKG.fatwa=built;
  }
}

/* تنزيل حزمة: يدعم مصدرين — أجزاء داخلية (تفسير) أو مصدر خارجي عبر CDN (حديث/فتاوى) */
let DL_BUSY=false;
async function downloadPackage(key){
  if(DL_BUSY){toast('يوجد تنزيل جارٍ، انتظر انتهاءه');return;}
  const rp=remotePkg(key);if(!rp){toast('حزمة غير معروفة');return;}
  const isSrc=!!(rp.source&&rp.source.urls&&rp.source.urls.length);
  if(!isSrc&&CONFIG.baseUrl.includes('USERNAME/REPO')){toast('⚠️ لم يُضبط رابط التحميل بعد');return;}
  DL_BUSY=true;
  const urls=isSrc?rp.source.urls:rp.parts.map(p=>CONFIG.baseUrl+p.file);
  const total=rp.bytes||(rp.parts?rp.parts.reduce((a,p)=>a+p.bytes,0):0)||1;
  const bar=document.getElementById('dlbar-'+key),lbl=document.getElementById('dllbl-'+key);
  const setP=(done,msg)=>{if(bar){bar.max=total;bar.value=done;}if(lbl)lbl.textContent=msg||(fmtMB(done)+' / '+fmtMB(total));};
  try{
    setP(0,'… التحضير');
    let done=0;const merged={};const objs=[];
    for(let i=0;i<urls.length;i++){
      const url=urls[i];
      const resp=await fetch(url,{cache:'no-store'});
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      let buf;
      if(resp.body&&resp.body.getReader){
        const reader=resp.body.getReader();const chunks=[];
        while(true){const{done:d,value}=await reader.read();if(d)break;chunks.push(value);done+=value.length;setP(done);}
        const all=new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));let off=0;for(const c of chunks){all.set(c,off);off+=c.length;}buf=all.buffer;
      }else{buf=await resp.arrayBuffer();done+=buf.byteLength;setP(done);}
      if(!isSrc){
        const part=rp.parts[i];
        if(buf.byteLength!==part.bytes)throw new Error('حجم الجزء غير مطابق ('+part.file+')');
        const hx=await sha256hex(buf);
        if(hx&&part.sha256&&hx!==part.sha256)throw new Error('بصمة التحقق غير مطابقة ('+part.file+')');
      }
      const obj=JSON.parse(new TextDecoder('utf-8').decode(buf));
      if(isSrc)objs.push(obj);else Object.assign(merged,obj);
    }
    setP(total,'… المعالجة والحفظ');
    if(isSrc){
      let built;
      if(rp.source.adapter==='ahmedbaset_hadith')built=adaptAhmedbasetHadith(rp,objs);
      else if(rp.source.adapter==='binbaz_fatwa')built=adaptBinbazFatwa(rp,objs);
      else throw new Error('محوّل غير معروف');
      await idbPut(key,{key,version:rp.version,bytes:total,type:rp.type,data:built,installedAt:Date.now()});
      injectPkg(rp.type,built);
    }else{
      await idbPut(key,{key,version:rp.version,bytes:total,type:(rp.type||'tafsir'),data:merged,installedAt:Date.now()});
      window.PKG.TAF=window.PKG.TAF||{};window.PKG.TAF[key]=merged;
    }
    S.installedPkgs=S.installedPkgs||{};S.installedPkgs[key]={version:rp.version,bytes:total,type:(rp.type||'tafsir'),installedAt:Date.now()};save();
    toast('✅ تم تنزيل «'+rp.short+'»');
  }catch(e){
    toast('تعذّر التنزيل: '+e.message);
  }finally{DL_BUSY=false;renderPackages();}
}

async function deletePackage(key){
  const rp=remotePkg(key),rec=S.installedPkgs&&S.installedPkgs[key];
  const t=(rp&&rp.type)||(rec&&rec.type)||'tafsir';
  try{await idbDel(key);}catch(e){}
  if(t==='hadith'){
    if(window.PKG.hadith&&window.PKG.hadith.books)window.PKG.hadith.books=window.PKG.hadith.books.filter(b=>b.key!==key);
    buildAll();
  }else if(t==='fatwa'){
    window.PKG.fatwa=null;
  }else{
    if(window.PKG.TAF)delete window.PKG.TAF[key];
    if(TAFED===key)TAFED='ibnkathir';
  }
  if(S.installedPkgs)delete S.installedPkgs[key];save();
  toast('تم حذف الحزمة وتحرير المساحة');renderPackages();
}

/* حقن بيانات حزمة مُنزّلة من IndexedDB إلى الذاكرة عند أول استخدام */
function ensureTafLoaded(edition,cb){
  const ed=tafEd(edition),mode=(ed&&ed.mode)||'embedded';
  if(mode==='embedded'){cb(true);return;}
  if(window.PKG.TAF&&window.PKG.TAF[edition]){cb(true);return;}
  if(!pkgInstalled(edition)){cb(false,'not_installed');return;}
  idbGet(edition).then(rec=>{
    if(rec&&rec.data){window.PKG.TAF=window.PKG.TAF||{};window.PKG.TAF[edition]=rec.data;cb(true);}
    else cb(false,'not_installed');
  }).catch(()=>cb(false,'error'));
}

/* ============ TAFSIR (ثلاثة تفاسير: واحد مدمج + اثنان يُنزّلان) ============ */
let TAFED='ibnkathir';
function tafEd(k){return (window.PKG.tafsirMeta.editions||[]).find(e=>e.key===k)||window.PKG.tafsirMeta.editions[0];}
function loadTafsirSurah(edition,sn,cb){
  if(window.PKG&&window.PKG.TAF&&window.PKG.TAF[edition]&&window.PKG.TAF[edition][sn]){cb(true);return;}
  const ed=tafEd(edition),mode=(ed&&ed.mode)||'embedded';
  if(mode==='download'){
    ensureTafLoaded(edition,(ok,reason)=>{
      if(!ok){cb(false,reason||'not_installed');return;}
      cb(!!(window.PKG.TAF&&window.PKG.TAF[edition]&&window.PKG.TAF[edition][sn]));
    });
    return;
  }
  const sc=document.createElement('script');sc.src='packages/tafsir/'+edition+'/s'+sn+'.js';
  sc.onload=()=>cb(true);sc.onerror=()=>cb(false);document.head.appendChild(sc);
}

function switchTafEd(edition,sn,an){

  const ed=tafEd(edition);
  if((ed.mode==='download')&&!pkgInstalled(edition)&&!(window.PKG.TAF&&window.PKG.TAF[edition])){document.getElementById('scr-tafsir').innerHTML=tafNotInstalledCard(edition);return;}
  document.getElementById('scr-tafsir').innerHTML='<div class="card muted" style="text-align:center">⏳ جارٍ فتح التفسير...</div>';
  loadTafsirSurah(edition,sn,(ok,reason)=>{if(!ok){document.getElementById('scr-tafsir').innerHTML=(reason==='not_installed')?tafNotInstalledCard(edition):'<div class="card empty">تعذّر تحميل هذا التفسير.</div>';return;}renderTafsirAyah(sn,an);});
}
function tafEdTabs(sn,an){
  return '<div class="card" style="padding:8px;display:flex;gap:6px;flex-wrap:wrap">'+(window.PKG.tafsirMeta.editions||[]).map(e=>{const need=(e.mode==='download')&&!pkgInstalled(e.key)&&!(window.PKG.TAF&&window.PKG.TAF[e.key]);const badge=need?' ☁️':'';return `<button class="chip" style="${e.key===TAFED?'background:var(--brand);color:#fff;border-color:var(--brand)':''}" onclick="switchTafEd('${e.key}',${sn},${an})">${esc(e.short)}${badge}</button>`;}).join('')+'</div>';

  <div style="display:flex;gap:8px">

function renderTafsir(){
  const M=window.PKG&&window.PKG.tafsirMeta;const Q=window.PKG&&window.PKG.quran;
  if(!M||!Q){document.getElementById('scr-tafsir').innerHTML='<div class="empty">حزمة التفسير غير محمّلة.</div>';return;}

function tafsirSurahListHtml(f){
  const Q=window.PKG.quran;const nf=normalize(f);
  const surahs=Q.surahs.filter(s=>!f||normalize(s.name).includes(nf)||String(s.n)===f);

  return '<div class="card" style="padding:6px 0">'+surahs.map(s=>`<div class="pkg" style="cursor:pointer;padding:11px 14px" onclick="openTafsir(${s.n},1)"><span style="width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--brand)">${s.n}</span><div style="flex:1"><div style="font-weight:600">سورة ${esc(s.name)}</div><div class="muted" style="font-size:.78rem">${s.ayahs.length} آية</div></div><span style="color:var(--muted)">‹</span></div>`).join('')+'</div>';
}

  const dot=inst?'dot on':'dot off';
  return `<div class="pkg" style="flex-wrap:wrap"><span class="${dot}"></span>
    <div style="flex:1;min-width:170px"><div style="font-weight:600">${esc(b.title)}</div>
      <div class="muted" style="font-size:.8rem">${esc(b.author)} • ${fmtMB(b.bytes)} • ${inst?'مُنزّل • يعمل دون إنترنت':'غير مُنزّل'}</div></div>
    <div style="display:flex;gap:6px">${btns}</div>
    <div style="flex-basis:100%;margin-top:6px${inst?';display:none':''}"><progress id="lbbar-${b.key}" value="0" max="1"></progress><div class="muted" id="lblbl-${b.key}" style="font-size:.72rem"></div></div>
  </div>`;
}
let LIB_BUSY=false;
async function libGetJson(url,tries){tries=tries||0;try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}catch(e){if(tries<2){await new Promise(z=>setTimeout(z,700));return libGetJson(url,tries+1);}throw e;}}
async function downloadLibBook(key){
  if(LIB_BUSY){toast('يوجد تنزيل جارٍ، انتظر انتهاءه');return;}
  const b=libBook(key);if(!b){toast('كتاب غير معروف');return;}
  LIB_BUSY=true;
  const bar=document.getElementById('lbbar-'+key),lbl=document.getElementById('lblbl-'+key);
  const base=libBase()+b.cat+'/'+b.bookId+'/';
  const setP=(v,m)=>{if(bar){bar.max=1;bar.value=v;}if(lbl)lbl.textContent=m||'';};
  try{
    setP(0.02,'… جلب بيانات الكتاب');
    const meta=await libGetJson(base+'metadata.json');
    const total=meta.chapter_count||0;const chapters=[];
    for(let i=1;i<=total;i++){
      let ch;
      try{ch=await libGetJson(base+'chapters/'+i+'.json');}catch(e){if(i===1)throw e;break;}
      const entries=(ch.entries||[]).map(en=>({id:en.id,text:(en.text_ar||'').trim(),ref:(en.reference||'').trim()}));
      chapters.push({id:(ch.chapter_id||i),title:(ch.title_ar||('الباب '+i)),entries});
      setP(i/Math.max(total,1),'تنزيل الباب '+i+' من '+total);
    }
    if(!chapters.length)throw new Error('لا توجد فصول');
    const built={key:b.key,bookId:b.bookId,cat:b.cat,name:(meta.title_ar||b.title),author:(meta.author_ar||b.author),chapters,entryCount:(meta.entry_count||0)};
    const bytes=meta.total_size_bytes||b.bytes||0;
    setP(1,'… الحفظ داخل الجهاز');
    await idbPut('lib:'+key,{key,type:'library',data:built,bytes,chapters:chapters.length,installedAt:Date.now()});
    window.PKG.LIB[key]=built;
    S.installedLibs=S.installedLibs||{};S.installedLibs[key]={bytes,chapters:chapters.length,installedAt:Date.now()};save();
    toast('\u2705 تم تنزيل «'+built.name+'»');
  }catch(e){toast('تعذّر التنزيل: '+e.message);}
  finally{LIB_BUSY=false;renderKtb();}
}
async function deleteLibBook(key){
  try{await idbDel('lib:'+key);}catch(e){}
  if(window.PKG.LIB)delete window.PKG.LIB[key];
  if(S.installedLibs)delete S.installedLibs[key];save();
  toast('تم حذف الكتاب وتحرير المساحة');renderKtb();
}
function openKtbBook(key){
  const show=(bk)=>{KTB_CUR=bk;KTBCH=null;KTBCHQ='';go('ktbread');renderKtbRead();};
  if(window.PKG.LIB[key]){show(window.PKG.LIB[key]);return;}
  idbGet('lib:'+key).then(rec=>{if(rec&&rec.data){window.PKG.LIB[key]=rec.data;show(rec.data);}else toast('تعذّر فتح الكتاب — أعد تنزيله');}).catch(()=>toast('خطأ في القراءة'));
}
function renderKtbRead(){
  const el=document.getElementById('scr-ktbread');const bk=KTB_CUR;
  if(!bk){el.innerHTML='<div class="card muted">لم يُختر كتاب.</div><button class="btn ghost full" onclick="go(\'ktb\')">→ المكتبة</button>';return;}
  if(KTBCH==null){
    el.innerHTML=`<div class="card" style="border-right:4px solid var(--gold)"><h3>\uD83D\uDCD6 ${esc(bk.name)}</h3><span class="muted">${esc(bk.author)} • ${bk.chapters.length} باباً • ${bk.entryCount||''} مدخل</span></div>
      <div class="card"><input id="ktbCFind" placeholder="\uD83D\uDD0D بحث داخل هذا الكتاب..." value="${esc(KTBCHQ)}" oninput="ktbBookSearch(this.value)"></div>
      <div id="ktbCList"></div>
      <button class="btn ghost full" style="margin-top:12px" onclick="go('ktb')">→ المكتبة الإسلامية</button>`;
    ktbChapterList();
  }else{
    const idx=bk.chapters.findIndex(c=>c.id===KTBCH);const ch=idx>=0?bk.chapters[idx]:bk.chapters[0];
    el.innerHTML=`<div class="card" style="border-right:4px solid var(--gold)"><div class="muted" style="font-size:.78rem">${esc(bk.name)} — ${esc(bk.author)}</div><h3>${esc(ch.title)}</h3><span class="muted">الباب ${idx+1} من ${bk.chapters.length}</span></div>`+
      ch.entries.map(en=>ktbEntryCard(bk,ch,en,false)).join('')+
      `<div style="display:flex;gap:8px;margin-top:12px">${idx>0?`<button class="btn ghost" style="flex:1" onclick="openKtbChapter(${bk.chapters[idx-1].id})">← السابق</button>`:''}<button class="btn ghost" style="flex:1" onclick="ktbBackIndex()">الفهرس</button>${idx<bk.chapters.length-1?`<button class="btn ghost" style="flex:1" onclick="openKtbChapter(${bk.chapters[idx+1].id})">التالي →</button>`:''}</div>`;
    window.scrollTo(0,0);
  }
}
function ktbBackIndex(){KTBCH=null;renderKtbRead();}
function openKtbChapter(id){KTBCH=id;KTBCHQ='';renderKtbRead();}
function ktbBookSearch(v){KTBCHQ=v;ktbChapterList();}
function ktbChapterList(){
  const box=document.getElementById('ktbCList');if(!box)return;const bk=KTB_CUR;const q=normalize(KTBCHQ);
  if(q&&q.length>1){
    let hits=[];
    for(const ch of bk.chapters){for(const en of ch.entries){const t=en._n||(en._n=normalize(en.text));if(t.includes(q)){hits.push([ch,en]);if(hits.length>=60)break;}}if(hits.length>=60)break;}
    box.innerHTML=`<div class="sec-title">\uD83D\uDD0D نتائج (${hits.length}${hits.length>=60?'+':''})</div>`+(hits.length?hits.map(h=>ktbEntryCard(bk,h[0],h[1],true)).join(''):'<div class="card muted">لا نتائج.</div>');
  }else{
    box.innerHTML='<div class="card" style="padding:6px 0">'+bk.chapters.map((c,i)=>`<div class="pkg" style="cursor:pointer;padding:11px 14px" onclick="openKtbChapter(${c.id})"><span style="min-width:26px;color:var(--muted);font-size:.8rem">${i+1}</span><div style="flex:1;font-weight:600">${esc(c.title)}</div><span class="muted" style="font-size:.72rem">${c.entries.length}</span><span style="color:var(--muted)">‹</span></div>`).join('')+'</div>';
  }
}
function ktbEntryCard(bk,ch,en,showCh){
  const srcline=`${esc(bk.name)} — ${esc(bk.author)}${showCh?(' • '+esc(ch.title)):''}${en.ref?(' • '+esc(en.ref)):''}`;
  return `<div class="card"><div class="arabic-text">${esc(en.text)}</div><span class="src">${srcline}</span>
    <div style="margin-top:8px"><button class="chip" onclick="ktbShareE(${ch.id},${en.id})">\u2197 مشاركة</button></div></div>`;
}
function ktbShareE(chId,enId){
  const bk=KTB_CUR;if(!bk)return;const ch=bk.chapters.find(c=>c.id===chId);if(!ch)return;const en=ch.entries.find(e=>e.id===enId);if(!en)return;
  const src=bk.name+' — '+bk.author+(en.ref?(' • '+en.ref):'');
  const text=en.text+'\n\n['+src+']';
  if(navigator.share){navigator.share({text}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('تم نسخ النص مع مصدره')).catch(()=>toast('تعذّر النسخ'));}
  else toast('المشاركة غير مدعومة');
}
(function restoreLibs(){try{if(!S.installedLibs||!window.indexedDB)return;Object.keys(S.installedLibs).forEach(k=>{idbGet('lib:'+k).then(rec=>{if(rec&&rec.data)window.PKG.LIB[k]=rec.data;}).catch(()=>{});});}catch(e){}})();

</script>
